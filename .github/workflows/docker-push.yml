# 工作流名称
name: Push Docker Image to DockerHub

# 触发条件
on:
  # 1. 手动在 Actions 页面触发
  workflow_dispatch:
  # 2. 当代码被推送到 main 分支时自动触发 (可选，但推荐)
  push:
    branches:
      - main

# 任务列表
jobs:
  build-and-push:
    # 运行环境
    runs-on: ubuntu-latest
    # 任务步骤
    steps:
      # 步骤 1: 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

      # 步骤 2: 设置 Docker Buildx，用于构建镜像
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

      # 步骤 3: 登录到 Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }} # 使用在 GitHub 中设置的 Secret
        password: ${{ secrets.DOCKERHUB_TOKEN }}   # 使用在 GitHub 中设置的 Secret

      # 步骤 4: 构建并推送 Docker 镜像
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .               # 构建上下文，通常是项目根目录
        push: true               # 推送到镜像仓库
        tags: |
          liu0223/5zq:latest
          liu0223/5zq:sha-${{ github.sha }}
        cache-from: type=gha     # 使用 GitHub Actions 缓存来加速构建
        cache-to: type=gha,mode=max
